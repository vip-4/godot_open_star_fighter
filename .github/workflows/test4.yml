name: Test Export
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.0.1
          use-dotnet: false
          include-templates: true
      - run: godot --version
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tail -40
          ls -la build/web
