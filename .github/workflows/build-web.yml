name: Build Open Star Fighter Web
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
  actions: write
jobs:
  build-web:
    name: Build Godot Web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.0.1
          use-dotnet: false
          include-templates: true
      - name: Verify renderer patch
        run: grep "config/features" project.godot
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tail -40
      - name: Inject SEO/GEO metadata
        run: python3 scripts/inject_seo.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-star-fighter-web
          path: build/web
          retention-days: 7
